[package]
name = "beets"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "A performant in-memory B+Tree"
authors = ["James Prestwich <james@prestwi.ch>"]
repository = "https://github.com/prestwich/beets"
readme = "README.md"
keywords = ["btree", "b-plus-tree", "collections", "no-std"]
categories = ["data-structures", "no-std"]
exclude = [".github/", "benches/cpp/", "proptest-regressions/", "perf.md", "CLAUDE.md"]

[dependencies]
arbitrary = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
sweep-bptree = "0.4.1"

[[bench]]
name = "vs_btreemap"
harness = false

[[bench]]
name = "blocked_insert"
harness = false

[features]
default = ["std"]
std = ["alloc"]
# The heap-backed allocators (`Global`, `Slabs`) and everything that
# grows: without it the crate is core-only and the fixed-region arena
# (`FixedNodes`) is the whole allocator story.
alloc = []
# Exposes the invariant net and the differential harness (`harness`
# module) to external test drivers — the fuzz targets under fuzz/.
# Not a public API: exempt from semver, never enable it in production.
testutils = ["dep:arbitrary", "std"]

# Line tables for profilers (samply / cargo-flamegraph): lets samples map
# back to source through the heavy inlining. No runtime cost.
[profile.bench]
debug = true